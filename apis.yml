apis:
- aid: dayforward:graphql
  name: Dayforward GraphQL API
  description: 'A live GraphQL endpoint at api.dayforward.com/graphql that backs the
    Dayforward consumer application. Observed responding to GraphQL over HTTP POST
    (an empty operation returns a GRAPHQL_VALIDATION_FAILED error object, and {__typename}
    resolves to Query), but schema introspection is disabled and Dayforward publishes
    no public documentation, reference or schema for it. Recorded as an observed,
    undocumented surface — no schema has been captured or reconstructed.'
