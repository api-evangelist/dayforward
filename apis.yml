aid: dayforward
name: Dayforward
description: 'Dayforward is a New York-based life insurance technology and services
  group founded in 2019 by Aaron Shapiro. It owns Commercial Travelers Life Insurance
  Company (NY-domiciled carrier) and Dayforward Insurance Agency LLC (licensed in all
  50 states), and sells income-replacement term life insurance direct to consumers at
  dayforward.com. Since pivoting to B2B at dayforward.io it licenses Workbench — a SaaS
  platform covering the full life insurance lifecycle from agent selling and automated
  underwriting through policy administration and service — plus managed distribution,
  underwriting and administration services to other carriers and distributors. Workbench
  is marketed as including "APIs, plug-and-play widgets, single sign-on support, and
  robust administration tools", but Dayforward publishes no public developer portal,
  API documentation, OpenAPI definition or SDKs.'
